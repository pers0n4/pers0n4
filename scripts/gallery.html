<!doctype html>
<html
  lang="en"
  data-color-mode="auto"
  data-light-theme="light"
  data-dark-theme="dark"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>pers0n4 · Assets</title>
    <link rel="stylesheet" href="primer.css" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: var(--fontStack-sansSerif);
      }
      :root[data-color-mode="light"] {
        color-scheme: light;
      }
      :root[data-color-mode="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: var(--text-body-shorthand-medium);
        background: var(--bgColor-default);
        color: var(--fgColor-default);
      }
      button,
      input {
        font: inherit;
      }
      button,
      a,
      input {
        outline-offset: var(--space-xs);
      }
      :focus-visible {
        outline: var(--focus-outline);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        cursor: pointer;
      }
      header {
        height: 70px;
        border-bottom: var(--border-default);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 calc(2 * var(--space-lg));
        background: var(--bgColor-muted);
      }
      .brand {
        display: flex;
        gap: var(--space-md);
        align-items: center;
        font-weight: var(--base-text-weight-semibold);
      }
      .brand-path {
        color: var(--fgColor-muted);
        font-weight: var(--text-body-weight);
      }
      .header-actions {
        display: flex;
        gap: var(--space-lg);
        align-items: center;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: calc(100vh - 70px);
      }
      aside {
        border-right: var(--border-default);
        padding: calc(2 * var(--space-lg)) var(--space-lg);
        background: var(--bgColor-muted);
      }
      .nav {
        margin-top: var(--space-lg);
        display: grid;
      }
      .nav button {
        display: flex;
        justify-content: space-between;
        border: 0;
        background: transparent;
        text-align: left;
      }
      .tree {
        border-top: var(--border-default);
        margin-top: var(--space-xl);
        padding-top: var(--space-xl);
        font: var(--text-body-weight) var(--text-body-size-small) /
          var(--base-text-lineHeight-loose) var(--fontStack-monospace);
        color: var(--fgColor-muted);
      }
      .tree summary {
        cursor: pointer;
        color: var(--fgColor-default);
      }
      .tree a {
        display: block;
        padding-left: var(--space-lg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree a:hover {
        color: var(--fgColor-accent);
      }
      main {
        padding: calc(2 * var(--space-lg)) calc(2 * var(--space-xl))
          var(--space-xl);
        max-width: 1500px;
        width: 100%;
      }
      .hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin: var(--space-xl) 0 var(--space-xl);
      }
      h1 {
        font: var(--text-display-shorthand);
        margin: 0 0 var(--space-sm);
      }
      .total {
        font: var(--text-body-weight) var(--text-body-size-small) /
          var(--text-body-lineHeight-small) var(--fontStack-monospace);
        color: var(--fgColor-accent);
        white-space: nowrap;
        padding-bottom: var(--space-sm);
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-lg);
        margin-bottom: var(--space-xl);
      }
      .search {
        width: 340px;
        max-width: 100%;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 var(--space-lg);
      }
      .section-head h2 {
        font: var(--text-title-shorthand-small);
        margin: 0;
      }
      .count {
        font: var(--text-body-weight) var(--text-body-size-small) /
          var(--text-body-lineHeight-small) var(--fontStack-monospace);
        color: var(--fgColor-muted);
        margin-left: var(--space-sm);
      }
      .section-head span:last-child {
        font: var(--text-body-weight) var(--text-body-size-small) /
          var(--text-body-lineHeight-small) var(--fontStack-monospace);
        color: var(--fgColor-muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-md);
      }
      .card {
        background: var(--bgColor-muted);
        border: var(--border-default);
        border-radius: var(--borderRadius-default);
        overflow: hidden;
      }
      .card:hover {
        border-color: var(--borderColor-emphasis);
      }
      .stage {
        height: 65px;
        background: var(--bgColor-default);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-sm);
      }
      .stage img {
        max-width: 100%;
        height: 28px;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-xs);
        padding: var(--space-md);
      }
      .filename {
        font: var(--text-body-weight) var(--text-body-size-small) /
          var(--text-body-lineHeight-small) var(--fontStack-monospace);
        color: var(--fgColor-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy {
        flex-shrink: 0;
      }
      #snakes {
        margin-top: calc(2 * var(--space-lg));
      }
      .snakegrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-md);
      }
      .snake-stage {
        height: 165px;
        background: var(--bgColor-default);
        display: flex;
        align-items: center;
        padding: var(--space-lg);
      }
      .snake-stage img {
        width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .snake-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-md);
        gap: var(--space-sm);
      }
      .error {
        font: var(--text-body-shorthand-small);
        color: var(--fgColor-danger);
      }
      .toast {
        position: fixed;
        bottom: var(--space-xl);
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 2 * var(--space-lg));
        margin: 0;
      }
      .empty {
        grid-column: 1/-1;
        border: var(--borderWidth-default) dashed var(--borderColor-default);
        padding: var(--space-xl);
        text-align: center;
        color: var(--fgColor-muted);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        main {
          padding: calc(2 * var(--space-lg)) var(--space-xl);
        }
      }
      @media (max-width: 760px) {
        .layout {
          display: block;
        }
        aside {
          display: none;
        }
        header {
          padding: 0 var(--space-lg);
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .snakegrid {
          grid-template-columns: 1fr;
        }
        main {
          padding: var(--space-xl) var(--space-lg);
        }
        .hero {
          align-items: flex-start;
          gap: var(--space-lg);
        }
        h1 {
          font: var(--text-title-shorthand-large);
        }
        .search {
          width: 100%;
        }
        .toolbar {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="https://github.com/pers0n4/pers0n4"
        >pers0n4 <span class="brand-path">/ assets</span></a
      >
      <div class="header-actions">
        <button class="btn" id="theme" type="button" aria-label="Switch theme">
          Theme: System
        </button>
      </div>
    </header>
    <div class="layout">
      <aside>
        <nav class="filter-list nav" aria-label="Asset filters">
          <button
            class="filter-item selected"
            data-filter="all"
            aria-pressed="true"
          >
            All assets <span id="all-count"></span></button
          ><button
            class="filter-item"
            data-filter="badges"
            aria-pressed="false"
          >
            Badges <span id="badge-count"></span></button
          ><button class="filter-item" data-filter="snake" aria-pressed="false">
            Snake <span id="snake-count"></span>
          </button>
        </nav>
        <div class="tree">
          <details open>
            <summary>assets/</summary>
            <details open style="padding-left: var(--space-md)">
              <summary>badges/</summary>
              <div id="file-links"></div>
            </details>
            <details id="snake-tree" open style="padding-left: var(--space-md)">
              <summary>snake/</summary>
              <div id="snake-links"></div>
            </details>
          </details>
        </div>
      </aside>
      <main>
        <div class="hero">
          <h1>Assets</h1>
          <div class="total" id="total"></div>
        </div>
        <div class="toolbar">
          <input
            class="form-control search"
            id="search"
            type="search"
            aria-label="Search assets"
            placeholder="Search…"
          />
        </div>
        <section id="badges">
          <div class="section-head">
            <h2>Badges <span class="count" id="visible-count"></span></h2>
          </div>
          <div class="grid" id="badge-grid"></div>
        </section>
        <section id="snakes">
          <div class="section-head">
            <h2>Snake <span class="count" id="snake-visible-count"></span></h2>
          </div>
          <div class="snakegrid" id="snake-grid"></div>
        </section>
      </main>
    </div>
    <div class="Toast toast" id="toast" role="status" hidden>
      <span class="Toast-content" id="toast-message"></span>
    </div>
    <script id="asset-catalog" type="application/json">
      "__ASSET_CATALOG__"
    </script>
    <script>
      const $ = (id) => document.getElementById(id);
      const { badges, snakes } = JSON.parse($("asset-catalog").textContent);
      let filter = "all";
      const root = document.documentElement;
      let theme = "system";
      function applyTheme() {
        root.dataset.colorMode = theme === "system" ? "auto" : theme;
        $("theme").textContent =
          "Theme: " + theme[0].toUpperCase() + theme.slice(1);
      }
      applyTheme();
      $("theme").addEventListener("click", () => {
        theme =
          theme === "system" ? "light" : theme === "light" ? "dark" : "system";
        applyTheme();
      });
      function showToast(message) {
        $("toast-message").textContent = message;
        $("toast").hidden = false;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => ($("toast").hidden = true), 2600);
      }
      async function copy(url) {
        try {
          await navigator.clipboard.writeText(url);
          showToast("URL copied.");
        } catch {
          showToast("Clipboard unavailable. Copy the link manually.");
        }
      }
      function markImageError(image) {
        const message = document.createElement("span");
        message.className = "error";
        message.textContent = "Image unavailable.";
        image.replaceWith(message);
      }
      function image(src, alt) {
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        img.addEventListener("error", () => markImageError(img));
        return img;
      }
      function render() {
        const query = $("search").value.toLowerCase().trim();
        const visible = badges.filter((b) =>
          (b.filename + " " + b.title).toLowerCase().includes(query),
        );
        $("badge-grid").replaceChildren();
        $("badges").hidden = filter === "snake";
        const visibleSnakes = new Set(
          snakes
            .filter((snake) =>
              (
                snake.filename +
                " " +
                snake.variant +
                " snake github contribution"
              )
                .toLowerCase()
                .includes(query),
            )
            .map((snake) => snake.filename),
        );
        $("snakes").hidden = !visibleSnakes.size || filter === "badges";
        $("snake-visible-count").textContent = String(
          visibleSnakes.size,
        ).padStart(2, "0");
        document.querySelectorAll("#snake-grid .card").forEach((card) => {
          card.hidden = !visibleSnakes.has(card.dataset.filename);
        });
        $("visible-count").textContent = String(visible.length).padStart(
          2,
          "0",
        );
        for (const b of visible) {
          const card = document.createElement("article");
          card.className = "card";
          const stage = document.createElement("div");
          stage.className = "stage";
          stage.append(image(b.preview, b.title));
          const meta = document.createElement("div");
          meta.className = "meta";
          const link = document.createElement("a");
          link.className = "filename";
          link.href = b.endpoint;
          link.textContent = b.filename;
          link.title = "Open JSON source";
          const button = document.createElement("button");
          button.className = "btn btn-sm copy";
          button.type = "button";
          button.textContent = "Copy ↗";
          button.setAttribute("aria-label", "Copy " + b.title + " Shields URL");
          button.addEventListener("click", () => copy(b.shields));
          meta.append(link, button);
          card.append(stage, meta);
          $("badge-grid").append(card);
        }
        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No matching assets.";
          $("badge-grid").append(empty);
        }
      }
      $("search").addEventListener("input", render);
      document.querySelectorAll("[data-filter]").forEach((button) =>
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((b) => {
            b.classList.toggle("selected", b === button);
            b.setAttribute("aria-pressed", String(b === button));
          });
          render();
        }),
      );
      for (const b of badges) {
        const link = document.createElement("a");
        link.href = b.endpoint;
        link.textContent = b.filename;
        $("file-links").append(link);
      }
      for (const { filename, url, publicUrl, variant } of snakes) {
        const fileLink = document.createElement("a");
        fileLink.href = url;
        fileLink.textContent = filename;
        $("snake-links").append(fileLink);
        const card = document.createElement("article");
        card.className = "card";
        card.dataset.filename = filename;
        const stage = document.createElement("div");
        stage.className = "snake-stage " + variant;
        stage.dataset.colorMode = variant;
        stage.dataset.lightTheme = "light";
        stage.dataset.darkTheme = "dark";
        stage.append(image(url, variant + " contribution snake"));
        const meta = document.createElement("div");
        meta.className = "snake-meta";
        const link = document.createElement("a");
        link.className = "filename";
        link.href = url;
        link.textContent = filename;
        const button = document.createElement("button");
        button.className = "btn btn-sm copy";
        button.type = "button";
        button.textContent = "Copy ↗";
        button.addEventListener("click", () => copy(publicUrl));
        meta.append(link, button);
        card.append(stage, meta);
        $("snake-grid").append(card);
      }
      $("badge-count").textContent = String(badges.length).padStart(2, "0");
      $("snake-count").textContent = String(snakes.length).padStart(2, "0");
      $("snake-visible-count").textContent = String(snakes.length).padStart(
        2,
        "0",
      );
      $("snake-tree").hidden = !snakes.length;
      document.querySelector('[data-filter="snake"]').hidden = !snakes.length;
      $("all-count").textContent = String(
        badges.length + snakes.length,
      ).padStart(2, "0");
      $("total").textContent = badges.length + snakes.length + " assets";
      render();
    </script>
  </body>
</html>

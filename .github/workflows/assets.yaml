name: Assets
run-name: >-
  ${{ github.event_name == 'schedule' && 'Assets · Scheduled' || format('Assets · {0} · {1}', github.event_name == 'push' && 'Push' || 'Manual', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/assets.yaml
  schedule:
    - cron: "0 15 * * *" # 00:00 KST (UTC+09:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types and formatting
        run: bun run check
      - name: Generate badges
        run: bun run build:prepare
      - name: Run tests
        run: bun test scripts/
      - name: Generate contribution snakes
        if: github.ref == 'refs/heads/main'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-snake-light.svg
            assets/snake/github-snake-dark.svg?palette=github-dark
      - name: Build gallery
        run: bun run build:gallery
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: assets

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
        id: deployment

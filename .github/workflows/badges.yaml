name: Deploy static badges

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/badges.yaml
  pull_request:
    paths:
      - README.md
      - scripts/**
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/badges.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
